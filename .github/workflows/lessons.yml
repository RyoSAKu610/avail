name: Lessons

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Solutions match expected output
        run: node check.mjs --all --solution

      - name: Exercises run without errors
        run: node check.mjs --all --smoke

      - name: Go code is gofmt-formatted
        run: test -z "$(gofmt -l lessons)"

      - name: Go vet
        run: go vet ./lessons/...

      - name: Go tests pass for solutions
        run: go test $(go list ./lessons/... | grep '/solution$')

      - name: Site and README roadmap are up to date
        run: |
          cd site
          npm ci
          npm run build
          git diff --exit-code -- index.html ../README.md
